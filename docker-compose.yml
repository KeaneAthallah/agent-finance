name: agent-finance

services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: dev
        env_file: .env
        environment:
            # Inside the compose network the services are reachable by name.
            DB_HOST: mysql
            REDIS_HOST: redis
        volumes:
            - .:/var/www
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - .:/var/www:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        restart: unless-stopped

    frontend:
        image: node:22-alpine
        working_dir: /app
        # Anonymous volume so the container installs Linux-native deps
        # without clobbering the host's node_modules (Windows/macOS dev).
        volumes:
            - .:/app
            - /app/node_modules
        ports:
            - '5173:5173'
        command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
        profiles: ['hmr']
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        environment:
            # Dedicated vars so a local .env with root/other credentials can
            # never break the container bootstrap (MYSQL_USER must not be root).
            # These mirror DB_* for the app containers via env_file + DB_HOST=mysql.
            MYSQL_DATABASE: agent_finance
            MYSQL_USER: agent_finance
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: secret
        ports:
            # Host-side mapping only; containers always reach mysql:3306.
            # Defaults to 33061 to avoid clashes with a local MySQL install.
            - '${DB_HOST_PORT:-33061}:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-psecret']
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    queue:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: dev
        env_file: .env
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        volumes:
            - .:/var/www
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command:
            [
                'php',
                'artisan',
                'queue:work',
                'redis',
                '--tries=3',
                '--backoff=10',
                '--timeout=600',
                '--memory=256',
            ]
        restart: unless-stopped

    scheduler:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: dev
        env_file: .env
        environment:
            DB_HOST: mysql
            REDIS_HOST: redis
        volumes:
            - .:/var/www
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        ports:
            - '9000:9000'
            - '9001:9001'
        volumes:
            - minio-data:/data
        profiles: ['storage']
        restart: unless-stopped

volumes:
    mysql-data:
    redis-data:
    minio-data:
