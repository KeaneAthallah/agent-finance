server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 100m;

    # Docker's embedded DNS: `app` is re-resolved per request (variable
    # fastcgi_pass) instead of being pinned at startup, so restarting the
    # app container no longer leaves nginx pointing at a dead IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }

    location ~ \.php$ {
        set $fastcgi_upstream app;
        fastcgi_pass $fastcgi_upstream:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
